<main>
<header class="row"><div><div class="brand">MY LITTLE SAVINGS JOURNAL</div><h1>慢慢存 🌿</h1><div class="muted">把日子过好，把小小的积累留下来</div></div><button class="icon-btn" id="settings" aria-label="设置">⚙</button></header>

<div class="sectionhead"><h2>快速记账</h2><button class="textbtn" id="editQuick">自选入口 →</button></div><div class="quick" id="quick"></div>
<div class="sectionhead"><h2>花钱去哪儿了</h2><button class="textbtn" id="manageCategories">管理分类 →</button></div><section class="panel" id="categoryChart"></section>
<div class="sectionhead"><h2>本月收支安排</h2><button class="textbtn" id="editBudget">调整计划 →</button></div><section class="panel" id="planPanel"></section>
<div id="budgetSection" class="hidden"><div class="sectionhead"><h2>分类预算</h2><button class="textbtn" id="editCategoryBudget">调整额度 →</button></div><section class="panel" id="budgetPanel"></section></div>

<script>

function planEditor(){planDraft=clone(plan());drawPlanEditor()}
function incomeRow(x){return `<div class="edit-row" data-income="${esc(x.id)}"><div class="edit-main"><input class="item-name" aria-label="收入名称" maxlength="60" value="${esc(x.name)}" required placeholder="收入名称"><input class="item-amount" aria-label="收入金额" type="number" inputmode="decimal" min="0" step="0.01" value="${x.amount}" required><button class="remove" type="button" data-remove-income="${esc(x.id)}" aria-label="移除此收入项目">×</button></div></div>`}
function fixedRow(x){return `<div class="edit-row" data-fixed="${esc(x.id)}"><div class="edit-main"><input class="item-name" aria-label="固定开支名称" maxlength="60" value="${esc(x.name)}" required placeholder="如话费、会员"><input class="item-amount" aria-label="固定开支金额" type="number" inputmode="decimal" min="0" step="0.01" value="${x.amount}" required><button class="remove" type="button" data-remove-fixed="${esc(x.id)}" aria-label="移除此固定开支">×</button></div><label class="edit-extra">每月缴费日 <input class="item-day" aria-label="缴费日" type="number" inputmode="numeric" min="1" max="31" step="1" placeholder="选填" value="${x.dueDay||''}"> <span>留空表示不设日期</span></label></div>`}
function capturePlan(){planDraft.incomeItems=[...document.querySelectorAll('[data-income]')].map(r=>({id:r.dataset.income,name:r.querySelector('.item-name').value,amount:r.querySelector('.item-amount').value}));planDraft.fixedExpenses=[...document.querySelectorAll('[data-fixed]')].map(r=>({id:r.dataset.fixed,name:r.querySelector('.item-name').value,amount:r.querySelector('.item-amount').value,dueDay:Number(r.querySelector('.item-day').value)||0}));planDraft.savePlan=$('planSave').value;for(const el of document.querySelectorAll('[data-budget]'))planDraft.categoryBudgets[el.dataset.budget]=el.value===''?0:el.value}
function updatePlanSummary(){capturePlan();const t=totals(planDraft),allocated=cents(Object.values(planDraft.categoryBudgets).reduce((a,b)=>a+amount(b),0));$('planSummary').innerHTML=`计划收入 <b>${mny(t.income)}</b> − 固定开支 <b>${mny(t.fixed)}</b><br>− 计划储蓄 <b>${mny(planDraft.savePlan)}</b> = 生活预算 <b class="${t.budget<0?'warning':'green'}">${mny(t.budget)}</b><br>分类已分配 ${mny(allocated)} · ${allocated>t.budget?'<span class="warning">分类额度合计超过生活预算</span>':`未分配 ${mny(t.budget-allocated)}`}`}
function drawPlanEditor(){const keepDefault=$('recurringDefault')?.checked||false;modal(`${Number(view.slice(5))} 月收支计划`,`<div class="notice">逐项安排收入和固定开支。只调整本月，或同时存为之后月份的默认计划。</div><form id="planForm"><h4>💼 收入安排</h4><div id="incomeRows">${planDraft.incomeItems.map(incomeRow).join('')}</div><button class="mini-add" type="button" id="addIncome">＋ 添加收入（工资 / 兼职 / 其他）</button><h4>🏠 固定开支</h4><div class="hint">填写每月固定发生的费用，例如房租、水电、话费、交通月卡、会员订阅。</div><div id="fixedRows">${planDraft.fixedExpenses.map(fixedRow).join('')}</div><button class="mini-add" type="button" id="addFixed">＋ 添加固定开支</button><h4>🐷 先留一点给自己</h4>${numField('planSave','本月计划存钱',planDraft.savePlan,'required')}<details id="categoryBudgetDetails"><summary>分类预算（选填） · 展开设置</summary><div class="hint" style="margin:10px 0">从生活预算中分配额度，不会再次扣钱。填 0 或留空表示不限额。</div>${data.categories.filter(c=>!c.archived||amount(planDraft.categoryBudgets[c.id])>0).map(c=>`<div class="budget-row"><label for="b-${esc(c.id)}">${esc(c.icon)} ${esc(c.name)}</label><input id="b-${esc(c.id)}" data-budget="${esc(c.id)}" type="number" inputmode="decimal" min="0" step="0.01" placeholder="不限额" value="${amount(planDraft.categoryBudgets[c.id])||''}" aria-label="${esc(c.name)}预算"></div>`).join('')}</details><div class="summary-box" id="planSummary" aria-live="polite"></div><label class="checkline"><input type="checkbox" id="recurringDefault"${keepDefault?' checked':''}><span>同时设为以后每月的默认计划<br><span class="micro">已有独立计划的月份会保留，不会覆盖历史记录。</span></span></label><button class="primary">保存 ${Number(view.slice(5))} 月计划</button></form>`);
 $('planForm').oninput=updatePlanSummary;
 $('addIncome').onclick=()=>{capturePlan();planDraft.incomeItems.push({id:uid(),name:'',amount:0});drawPlanEditor()};$('addFixed').onclick=()=>{capturePlan();planDraft.fixedExpenses.push({id:uid(),name:'',amount:0,dueDay:0});drawPlanEditor()};
 $('modalContent').onclick=e=>{const a=e.target.closest('[data-remove-income]'),b=e.target.closest('[data-remove-fixed]');if(!a&&!b)return;capturePlan();if(a)planDraft.incomeItems=planDraft.incomeItems.filter(x=>x.id!==a.dataset.removeIncome);if(b)planDraft.fixedExpenses=planDraft.fixedExpenses.filter(x=>x.id!==b.dataset.removeFixed);drawPlanEditor()};
 $('planForm').onsubmit=e=>{e.preventDefault();capturePlan();let p;try{p=cleanPlan(planDraft)}catch{return alert('请为每项收支填写名称和有效的非负金额。')}const t=totals(p),allocated=Object.values(p.categoryBudgets).reduce((a,b)=>a+b,0);if((t.budget<0||allocated>t.budget)&&!confirm('当前安排超过可用收入或生活预算，仍然保存吗？'))return;const recurring=$('recurringDefault').checked;if(commit(n=>{n.monthPlans[view]=p;if(recurring)n.defaultPlan=clone(p)})){planDraft=null;render();close();toast('本月收支安排已保存')}};updatePlanSummary();
}
function settings(){modal('我的设置',`<div class="notice">让分类和预算都适合你自己的生活。</div>${loadError?'<div class="notice caution">原有数据读取异常。请先下载原始数据，避免丢失记录。</div><button class="secondary" id="rawBackup">下载未修改的原始数据</button>':''}<button class="secondary" id="settingsPlan">本月收支与固定开支</button><button class="secondary" id="settingsCategories">管理分类 / 自定义分类</button><button class="secondary" id="settingsQuick">自选快速记账入口</button><button class="secondary" id="settingsGoal">调整储蓄目标</button><div class="divider"></div><h4>数据备份</h4><div class="hint">完整 JSON 包含消费、储蓄、分类、快速入口和每月收支计划。导入会替换本机现有数据。</div><button class="secondary" id="backup">↓ 下载完整 JSON 备份</button><button class="secondary" id="csv">↓ 导出日常支出 CSV</button><button class="secondary" id="restore">导入 JSON 备份</button><input id="fileInput" type="file" accept=".json,application/json" hidden><div class="micro" style="margin-top:18px">慢慢存 2.0 · 记录只在当前浏览器保存</div>`);
 $('settingsPlan').onclick=planEditor;$('settingsCategories').onclick=()=>categories();$('settingsQuick').onclick=quickEditor;$('settingsGoal').onclick=goalEditor;
 if(loadError)$('rawBackup').onclick=()=>download(raw,`慢慢存-原始数据-${today()}.json`,'application/json');
 $('backup').onclick=()=>download(JSON.stringify({...data,version:2},null,2),`慢慢存-完整备份-${today()}.json`,'application/json');
 $('csv').onclick=()=>{const cell=x=>'"'+String(x??'').replace(/^[=+@\-\t\r]/,"'$&").replaceAll('"','""')+'"',rows=[['日期','消费类别','金额','备注'],...data.expenses.map(x=>[x.date,cat(x.category).name,x.amount,x.note])];download('\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),`慢慢存-日常支出-${today()}.csv`,'text/csv;charset=utf-8')};
 $('restore').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error();const obj=JSON.parse(await file.text());if(!Array.isArray(obj.expenses)||!Array.isArray(obj.savings))throw Error();const incoming=normalize(obj);if(!confirm(`将导入 ${incoming.expenses.length} 笔支出和 ${incoming.savings.length} 笔储蓄，覆盖当前数据。建议先下载备份。确定导入？`))return;if(persist(incoming)){loadError=false;view=currentMonth();render();close();toast('导入成功')}}catch{alert('备份文件格式无效，现有记录没有改变。')}};
}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function goalEditor(){modal('我的储蓄目标',`<form id="goalForm">${textField('goalNameEdit','储蓄目标名称',data.goalName,'required maxlength="40"')}${numField('goalEdit','想存到多少钱',data.goal,'required min="0.01"')}${numField('startSavedEdit','开始使用前已有储蓄',data.startSaved,'required')}<div class="hint">每月计划储蓄在「收支计划」中修改；实际存入的金额请用「记录存钱」。</div><button class="primary">保存储蓄目标</button></form>`);$('goalForm').onsubmit=e=>{e.preventDefault();const goal=Number($('goalEdit').value),start=Number($('startSavedEdit').value),name=$('goalNameEdit').value.trim();if(!name||!moneyOk(goal)||goal<=0||!moneyOk(start))return;if(commit(n=>Object.assign(n,{goalName:name,goal:cents(goal),startSaved:cents(start)}))){render();close();toast('目标已更新')}}}
function save(){modal('记录实际存钱',`<div class="notice">记下已经实际转入储蓄的钱。计划储蓄只是预算安排，不代表已经存入，也不会再次从生活预算扣除。</div><form id="saveForm">${numField('savedAmt','已经存下的金额','','required min="0.01" placeholder="0.00"')}${textField('savedNote','备注（选填）','','maxlength="60" placeholder="例如 发薪日的小积累"')}<div class="field"><label for="saveDate">日期</label><input id="saveDate" type="date" value="${today()}" required></div><button class="primary">保存储蓄记录</button></form><button class="secondary" id="savingHistory">查看 / 删除储蓄记录</button>`);$('saveForm').onsubmit=e=>{e.preventDefault();const a=Number($('savedAmt').value),date=$('saveDate').value;if(!moneyOk(a)||a<=0||!validDate(date))return;if(commit(n=>n.savings.push({id:uid(),amount:cents(a),date,note:$('savedNote').value.trim()}))){render();close();toast('又存下一点，真好 🌱')}};$('savingHistory').onclick=savingHistory}
function savingHistory(){modal('储蓄记录',`<div class="record" style="margin-top:18px">${data.savings.length?[...data.savings].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry"><div class="descflex"><b>${esc(x.note||'存钱')}</b><small>${esc(x.date)}</small></div><div class="price green">+${mny(x.amount)}</div><button class="remove" data-saving="${esc(x.id)}" aria-label="删除储蓄记录">×</button></div>`).join(''):'<div class="empty">还没有实际存钱的记录</div>'}</div><button class="secondary" id="backSaving">返回</button>`);$('backSaving').onclick=save;$('modalContent').onclick=e=>{const b=e.target.closest('[data-saving]');if(b&&confirm('确定删除这条储蓄记录？')&&commit(n=>n.savings=n.savings.filter(x=>x.id!==b.dataset.saving))){render();savingHistory()}}}
function calculator(){const p=plan(),left=cents(totals(p).budget-sum(entries('expenses')));modal('消费前算一算',`<div class="notice">当前月份生活预算剩余 <b>${mny(left)}</b></div><div class="field"><label for="calcCategory">这笔钱属于</label><select id="calcCategory">${categoryOptions(data.quickCategories[0])}</select></div>${numField('candidate','准备花多少钱','','min="0" placeholder="填入这笔消费金额"')}<button class="primary" id="calc">计算消费影响</button><div id="calcResult" class="notice hidden" aria-live="polite"></div><button class="secondary" id="recordCandidate">按此分类记一笔</button>`);$('calc').onclick=async()=>{const val=$('candidate').value,a=Number(val),id=$('calcCategory').value;if(!moneyOk(val))return toast('先填一个有效金额');const after=cents(left-a),limit=amount(p.categoryBudgets[id]),used=sum(entries('expenses').filter(x=>x.category===id)),days=view===currentMonth()?daysInMonth()-new Date().getDate()+1:view>currentMonth()?daysInMonth():0;$('calcResult').classList.remove('hidden');$('calcResult').innerHTML=`消费后还剩 <b class="${after<0?'warning':'green'}">${mny(after)}</b>${days?`，平均每天可用 ${mny(Math.max(0,after)/days)}`:''}。<br>${limit?`${esc(cat(id).name)}本月合计将达 ${mny(used+a)} / ${mny(limit)}${used+a>limit?'，超过分类预算。':'，仍在分类预算内。'}`:'这个分类暂未设置额度，可在收支计划中调整。'}`;const info=limitStatus(id,a);$('calcResult').classList.toggle('budget-exceeded',info.limit>0&&info.over>0);if(info.limit>0&&info.over>0){const ok=await limitDialog(info,'calculator');if(!ok)$('candidate').focus()}};$('recordCandidate').onclick=()=>{const val=$('candidate').value;if(!moneyOk(val)||Number(val)<=0)return toast('先填写大于 0 的金额');expense($('calcCategory').value,cents(val))};$('candidate').oninput=$('calcCategory').onchange=()=>$('calcResult').classList.add('hidden')}
$('add').onclick=()=>expense();$('settings').onclick=settings;$('editBudget').onclick=planEditor;$('editCategoryBudget').onclick=()=>{planEditor();$('categoryBudgetDetails').open=true;$('categoryBudgetDetails').scrollIntoView({block:'start'})};$('editQuick').onclick=quickEditor;$('manageCategories').onclick=()=>categories();$('saveAction').onclick=save;$('trySpend').onclick=calculator;$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};
$('quick').onclick=e=>{const b=e.target.closest('[data-cat]');if(b)expense(b.dataset.cat);else if(e.target.closest('#emptyQuick'))quickEditor()};
$('planPanel').onclick=e=>{const b=e.target.closest('[data-paid]');if(!b)return;const fixedId=b.dataset.paid;if(commit(n=>{if(!n.monthPlans[view])n.monthPlans[view]=clone(n.defaultPlan);if(!n.fixedPayments[view])n.fixedPayments[view]={};n.fixedPayments[view][fixedId]=!n.fixedPayments[view][fixedId]}))render()};
for(const [id,delta]of [['prev',-1],['next',1]])$(id).onclick=()=>{const d=new Date(Number(view.slice(0,4)),Number(view.slice(5))-1+delta,1);view=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;$('recordFilter').value='';render()};
$('recordFilter').onchange=renderRecords;$('records').onclick=e=>{const b=e.target.closest('[data-delete]');if(b&&confirm('确认删除这笔消费？')&&commit(n=>n.expenses=n.expenses.filter(x=>x.id!==b.dataset.delete)))render()};
document.addEventListener('keydown',e=>{if($('limitOverlay').classList.contains('open')){if(e.key==='Escape'){e.preventDefault();finishLimit(false)}if(e.key==='Tab'){const first=$('limitBack'),last=$('limitContinue');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(!$('overlay').classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='Tab'){const nodes=[...document.querySelector('.sheet').querySelectorAll('button,input,select,[tabindex]')].filter(x=>!x.hidden&&x.offsetParent!==null&&!x.disabled);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let renderedDay=today();function refreshDay(){if(today()!==renderedDay){renderedDay=today();render()}}setInterval(refreshDay,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay()});
render();if(loadError)setTimeout(()=>{settings();toast('原记录暂时无法读取，已保留原始数据')},0);
})();
</script>
</body>
</html>
